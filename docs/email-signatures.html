<!doctype html>
<!--
  Coastal Workflows — email signatures
  =====================================
  HOW TO USE
  1. Deploy the site so the logo is live at:  https://coastalworkflows.com/coastal-logo.png
     (the PNG lives at public/coastal-logo.png in this repo)
  2. Open this file in a browser.
  3. Select a signature block below (just the boxed signature, not the heading),
     copy it, and paste into your email client's signature editor:
       - Gmail:  Settings → See all settings → General → Signature → paste
       - Apple Mail:  Settings → Signatures → paste into the box
       - Outlook:  File → Options → Mail → Signatures → paste
  4. If the logo doesn't show, confirm the image URL above is publicly reachable
     and that the domain (coastalworkflows.com) is live.

  NOTE: the image URL is absolute and MUST be publicly hosted — email clients
  cannot read local files. Update the src in both blocks if you host it elsewhere.
-->
<html>
<head><meta charset="utf-8"><title>Coastal Workflows — Email Signatures</title></head>
<body style="font-family: Arial, sans-serif; background:#f4f1ea; padding:40px; color:#2C2C2A;">

  <h1 style="font-size:18px;">Email signatures — copy the boxed block</h1>

        <img src="https://coastalworkflows.com/coastal-logo.png" alt="Coastal Workflows" width="190" height="40" style="display:block; border:0; outline:none; width:190px; height:40px;">
      </td>
    </tr>
    <tr>
      <td style="border-top:2px solid #1D6A72; padding-top:10px; line-height:1.45;">

        <span style="font-size:13px; color:#1D6A72;">Principal Consultant · Coastal Workflows</span><br>

        <span style="color:#bbb;">&nbsp;|&nbsp;</span>
        <a href="https://coastalworkflows.com" style="font-size:13px; color:#1D6A72; text-decoration:none;">coastalworkflows.com</a>
      </td>
    </tr>
  </table>
